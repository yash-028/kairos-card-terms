name: Check card terms
on:
  pull_request:
    paths: ["cards.json", "validate.js"]
  push:
    branches: [main]
    paths: ["cards.json", "validate.js"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node validate.js cards.json
